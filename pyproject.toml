[tool.poetry]
name = "truebalance"
version = "1.0.0"
description = "Enterprise Double-Entry Personal Finance & Wealth Intelligence Platform"
authors = ["Kusuma Podili <podilikusuma15@gmail.com>"]
readme = "README.md"
packages = [
    { include = "core" },
    { include = "services" },
    { include = "adapters" }
]

[tool.poetry.dependencies]
python = "^3.10"
pydantic = "^2.6.0"
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
